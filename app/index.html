<title>Griaßdi App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell – floating sidebar + workspace; "Heute" = Anrufliste | Lead & Pitch | Dialer */
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FFF3EA; --ink:#1C1612; --muted:#7A6C63; --line:#F0E2D6;
  --accent:#D63A24; --accent-ink:#A8301B; --accent-soft:#FFE6DA; --sun:#FFB547;
  --good:#1E7A4C; --good-soft:#E3F4EA; --warn:#B26A00; --warn-soft:#FFF1D6; --bad:#B4321F; --bad-soft:#FDE4DF;
  --dial:#1F1813; --dial-2:#2B221C; --dial-ink:#FBF3EC; --dial-muted:#B9A99C; --dial-line:#3A2F27;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 8px 24px rgba(60,30,10,.06);
  --f-display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110E; --surface:#1E1814; --surface-2:#251D18; --ink:#F6EDE5; --muted:#A8988C; --line:#33291F;
  --accent:#FF6A4D; --accent-ink:#FF8C73; --accent-soft:#3A1F17; --sun:#FFC266;
  --good:#5FD39A; --good-soft:#163024; --warn:#F2B451; --warn-soft:#33270F; --bad:#FF8A78; --bad-soft:#3A1B16;
  --dial:#0E0B09; --dial-2:#1A1410; --dial-ink:#FBF3EC; --dial-muted:#A8988C; --dial-line:#2E251E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#1E1814; --surface-2:#251D18; --ink:#F6EDE5; --muted:#A8988C; --line:#33291F;
  --accent:#FF6A4D; --accent-ink:#FF8C73; --accent-soft:#3A1F17; --sun:#FFC266;
  --good:#5FD39A; --good-soft:#163024; --warn:#F2B451; --warn-soft:#33270F; --bad:#FF8A78; --bad-soft:#3A1B16;
  --dial:#0E0B09; --dial-2:#1A1410; --dial-ink:#FBF3EC; --dial-muted:#A8988C; --dial-line:#2E251E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;height:100%;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.navlist{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.navbtn .count{margin-left:auto;font-size:12px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.planbox{margin-top:auto;background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.planbox .meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.planbox .meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.planbox small{color:var(--muted)}

main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .hello{display:flex;align-items:center;gap:12px;min-width:0}
.top h1{font-size:24px}
.top p{margin:2px 0 0;color:var(--muted)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ai .dot{background:var(--good)}
.chip.off .dot{background:var(--warn)}

.view{min-height:0;flex:1;display:none}
.view.on{display:block}
#view-heute.on{display:grid}
#view-heute{grid-template-columns:300px minmax(0,1fr) 360px;gap:14px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column}
.panel-h{padding:16px 16px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h h2{font-size:17px}
.scroll{overflow:auto;min-height:0;flex:1}

/* Queue */
.prog{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.prog .bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good)}
.filters{display:flex;gap:4px;padding:0 12px 10px;flex-wrap:wrap}
input[type=range]{accent-color:var(--accent)}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qlist{list-style:none;margin:0;padding:0 8px 10px;display:flex;flex-direction:column;gap:4px}
.qitem{width:100%;border:1px solid transparent;background:none;text-align:left;border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--accent-ink);grid-row:span 2}
.qitem .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .c{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .why{grid-column:2/4;font-size:12px;color:var(--ink);display:flex;gap:6px;align-items:center;min-width:0}
.qitem .why span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-weight:700;font-size:12px;border-radius:8px;padding:2px 7px;background:var(--good-soft);color:var(--good)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.st-offen{background:var(--surface-2);color:var(--muted)}
.st-termin{background:var(--good-soft);color:var(--good)}
.st-rueckruf{background:var(--warn-soft);color:var(--warn)}
.st-kein,.st-falsch{background:var(--bad-soft);color:var(--bad)}
.st-nicht{background:var(--surface-2);color:var(--muted)}
.trig{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:1px 6px;flex:none}

/* Work */
.lead-h{padding:18px 20px 12px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lead-h .av{width:52px;height:52px;border-radius:16px;font-size:17px}
.lead-h h2{font-size:22px}
.lead-h .meta{color:var(--muted);margin-top:2px}
.contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.copy svg{width:14px;height:14px;color:var(--muted)}
.ring{margin-left:auto;text-align:center}
.ring b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--good)}
.ring small{color:var(--muted);font-size:11px}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabbody{padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px}
.why-now{background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.why-now p{margin:0;font-size:16px;font-weight:600;max-width:60ch}
.why-now small{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;margin-top:2px}
.block h3{font-size:15px;margin-bottom:8px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li .src{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.bullet{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.sources{display:flex;gap:6px;flex-wrap:wrap}
.sources span{font-size:11px;border:1px dashed var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}

.pitchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border:0;background:none;padding:6px 12px;font-weight:600;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.say{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.say p{margin:4px 0 0;font-size:16px;max-width:62ch}
.say.big p{font-size:18px;font-weight:600}
.obj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.obj b{color:var(--bad)}
.note{color:var(--muted);font-size:12px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:3px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* Dialer */
.dialer{background:var(--dial);color:var(--dial-ink);border-color:var(--dial-line)}
.dialer .panel-h h2{font-size:16px}
.dialer .label{color:var(--dial-muted)}
.d-status{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.d-status small{color:var(--dial-muted);display:block}
.d-who{padding:6px 18px 14px}
.d-who b{font-family:var(--f-display);font-size:20px;display:block}
.d-who span{color:var(--dial-muted)}
.timer{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:.02em;padding:0 18px}
.callbtn{margin:4px 18px 14px;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;background:#1FA463;color:#fff}
.callbtn:hover{background:#178a52}
.callbtn.end{background:#E0412B}
.callbtn.end:hover{background:#c23421}
.callbtn svg{width:20px;height:20px}
.d-sec{padding:12px 18px;border-top:1px solid var(--dial-line);display:flex;flex-direction:column;gap:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dial-muted);background:var(--dial-2);border-radius:10px;padding:7px 9px}
.check i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dial-muted);flex:none;display:grid;place-items:center}
.check.ok{color:var(--dial-ink)}
.check.ok i{background:#1FA463;border-color:#1FA463}
.check.ok i::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.coach{border-radius:14px;padding:12px 14px;background:var(--dial-2);border:1px solid var(--dial-line);display:flex;gap:10px;align-items:flex-start;animation:pop .3s ease}
.coach.gut{border-color:#1FA46355}
.coach.achtung{border-color:#FFB54766}
.coach p{margin:2px 0 0}
.coach .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.coach.gut .k{color:#5FD39A}.coach.tipp .k{color:#FFC266}.coach.achtung .k{color:#FF8A78}
@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
.transcript{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;padding-right:4px}
.line{font-size:13px;max-width:92%;padding:7px 10px;border-radius:12px;background:var(--dial-2)}
.line.du{align-self:flex-end;background:#3A2A20}
.line small{display:block;font-size:10.5px;color:var(--dial-muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ratio{height:8px;border-radius:9px;background:var(--dial-2);overflow:hidden;display:flex}
.ratio i{background:var(--sun)}
.ratio-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dial-muted)}
.helper{display:flex;gap:6px}
.helper input{flex:1;min-width:0;background:var(--dial-2);border:1px solid var(--dial-line);border-radius:10px;padding:8px 10px;color:var(--dial-ink)}
.helper button{border:0;border-radius:10px;background:var(--sun);color:#1F1813;font-weight:800;padding:0 12px}
.helper-out{font-size:13.5px;background:var(--dial-2);border-radius:12px;padding:10px 12px;border-left:3px solid var(--sun)}
.d-note{font-size:11.5px;color:var(--dial-muted);padding:10px 18px 16px}
.upsell{margin:6px 18px 14px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#3A2219,#2B221C);display:flex;flex-direction:column;gap:8px}
.upsell .btn{align-self:flex-start}

/* Tables / other views */
.page{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:22px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;margin-top:4px}
.kpi small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:12px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 36px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.hbar .t{height:10px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:9px;background:var(--accent)}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:13px}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.field textarea{min-height:76px;resize:vertical}
.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.conn{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.conn .lg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.conn div{min-width:0}
.conn small{display:block;color:var(--muted);font-size:12px}
.switch{margin-left:auto;width:38px;height:22px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:19px}
.icp{display:flex;flex-wrap:wrap;gap:6px}
.icp span{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.plan.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan b.p{font-family:var(--f-display);font-size:28px}
.plan ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.plan .btn{margin-top:auto;justify-content:center}

/* Admin */
.atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
.atab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;color:var(--muted);white-space:nowrap}
.atab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stepper button{border:0;background:none;width:34px;height:34px;font-size:18px;font-weight:700;color:var(--ink)}
.stepper button:hover{background:var(--surface-2)}
.stepper b{min-width:44px;text-align:center;font-family:var(--f-display);font-size:18px}
.bigset{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bigset .stepper b{font-size:30px;min-width:80px}
.bigset .stepper button{width:44px;height:52px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipsel{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chipsel[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.stackbar{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--surface-2);gap:2px}
.stackbar i{display:block;height:100%}
.distrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}

function kbBrief(){

  return {

               : [`Wie lösen Sie das Thema ${s.thema} heute?`,'Was ist dabei am mühsamsten?','Wer entscheidet bei Ihnen über so etwas mit?'],
    nutzen: s.nutzen,
    einwaende: P.einwaende.filter(e=>e.einwand&&e.antwort).map(e=>({einwand:e.einwand,antwort:e.antwort})),
    abschluss: ab,
    ki:false
  };
}

async function genPitch(l){

Verkäufer:in: ${s.name} von ${s.firma} (${s.website}). Produkt: ${s.produkt.name} – ${s.angebot}. Nutzen: ${s.nutzen.join('; ')}. Preis: ${s.produkt.preis}.

${kbBrief()}
Pitch-Einstellungen:
${pitchRules()}

Antworte nur mit JSON in genau dieser Form:
{"opener":"","bruecke":"","fragen":["","",""],"nutzen":["","",""],"einwaende":[{"einwand":"","antwort":""},{"einwand":"","antwort":""},{"einwand":"","antwort":""}],"abschluss":""}`;
  try{
    const r = await AI.json(prompt, {cache:false});
    const base = tplPitch(l);
    const p = {
      opener: typeof r.opener==='string'&&r.opener ? r.opener : base.opener,
      bruecke: typeof r.bruecke==='string'&&r.bruecke ? r.bruecke : base.bruecke,
      fragen: Array.isArray(r.fragen)&&r.fragen.length ? r.fragen.map(String).slice(0,4) : base.fragen,
      nutzen: Array.isArray(r.nutzen)&&r.nutzen.length ? r.nutzen.map(String).slice(0,4) : base.nutzen,
      einwaende: Array.isArray(r.einwaende)&&r.einwaende.length ? r.einwaende.filter(x=>x&&x.einwand).map(x=>({einwand:String(x.einwand),antwort:String(x.antwort||'')})).slice(0,4) : base.einwaende,
      abschluss: typeof r.abschluss==='string'&&r.abschluss ? r.abschluss : base.abschluss,
      ki:true
    };
    S.pitches[l.id+'|'+S.tone]=p; save(); toast('Neuer Pitch von Griaßdi');
  }catch(e){ pitchErr = aiErr(e); }

function startCall(){
  if (S.callsUsed >= callLimit()){ openPlans(); return; }
  const l = cur();
  S.callsUsed++; save();
  Object.assign(C,{status:'ringing',leadId:l.id,ringStart:Date.now(),start:0,t:0,ev:buildScript(l,pitchFor(l)),shown:0,lines:[],tip:null,covered:{},helper:'',helperBusy:false});
  renderDialer(); renderNav();
  clearInterval(C.iv);
  C.iv = setInterval(tick, 250);
}
function tick(){
  if (C.status==='ringing'){
    if (Date.now()-C.ringStart > 2600){ C.status='live'; C.start=Date.now(); renderDialer(); }
    return;
  }
  if (C.status!=='live') return;
  C.t = Math.floor((Date.now()-C.start)/1000);
  const tm = $('#d-timer'); if (tm) tm.textContent = fmtTime(C.t);
  let changed=false;
  while (C.shown < C.ev.length && C.ev[C.shown].t <= C.t){
    const e = C.ev[C.shown++]; changed=true;
    if (e.tip){ if (S.pitch.tipps) C.tip = {k:e.tip[0], text:e.tip[1]}; }
    else { C.lines.push(e); if (e.cover) C.covered[e.cover]=true; }
  }
  if (changed) updateLive();
}
function ratio(){
  let du=0, k=0; C.lines.forEach(x=>{ if(x.who==='du') du+=x.text.length; else k+=x.text.length; });
  const tot=du+k; return tot? Math.round(du/tot*100) : 0;
}
function pitchScore(){
  const n = Object.keys(C.covered).length; const r=ratio();
  let s = 3 + n*1.5; if (r>S.pitch.redeanteil+10) s-=1; return Math.max(1,Math.min(10,Math.round(s)));
}
function hangup(){
  clearInterval(C.iv);
  const wasLive = C.status==='live';
  C.status='wrap'; C.dur = wasLive ? Math.floor((Date.now()-C.start)/1000) : 0;
  renderDialer(); openWrap(wasLive);
}

/* ---------------- objection helper ---------------- */
function localObjection(text){
  const p = pitchFor(lead(C.leadId)); const t=text.toLowerCase();
  const pick = /zeit|stress|später|busy/.test(t)?0 : /unterlag|mail|schick|info/.test(t)?1 : /teuer|preis|kost|budget|haben schon|bereits|anbieter/.test(t)?2 : -1;
  return pick>=0 && p.einwaende[pick] ? p.einwaende[pick].antwort : (S.tone==='du'?'Versteh ich. Darf ich kurz fragen, was dir dabei am wichtigsten wäre?':'Verstehe ich. Darf ich kurz fragen, was Ihnen dabei am wichtigsten wäre?');
}
async function helpObjection(text){
  const out = $('#helper-out'); if(!out) return;
  C.covered.einwand = true; updateLive();
  if (!AI){ out.innerHTML = `<div class="helper-out">${esc(localObjection(text))}</div>`; return; }
  if (C.ctl) C.ctl.abort();
  C.ctl = new AbortController();
  out.innerHTML = '<div class="helper-out"><span class="dots"><i></i><i></i><i></i></span></div>';
  const l = lead(C.leadId), s=ctx(l);
  try{
    await AI(`Du coachst live während eines Kaltakquise-Telefonats im DACH-Raum. Ich verkaufe ${s.angebot}. Gegenüber: ${l.person}, ${l.rolle} bei ${l.firma}. Gegenüber sagt gerade: "${text}". Unser Wissen: ${kbBrief().slice(0,2500)}
Einwand-Bibliothek: ${S.pitch.einwaende.map(e=>e.einwand+' → '+e.antwort).join(' | ')}
Gib mir genau eine Antwort, die ich jetzt sagen kann: höchstens 2 kurze Sätze, ${tone()}, freundlich, endet mit einer Frage. Nur die Antwort, ohne Einleitung und ohne Anführungszeichen.`,
      {modelTier:'quick', cache:false, signal:C.ctl.signal, onText:({text})=>{ const o=$('#helper-out'); if(o) o.innerHTML=`<div class="helper-out">${esc(text)}</div>`; }});
  }catch(e){ const m=aiErr(e); if(m){ const o=$('#helper-out'); if(o) o.innerHTML=`<div class="helper-out">${esc(localObjection(text))}</div>`; } }
}

function tplWrap(l){
  const s=ctx(l), du=S.tone==='du', o=W.outcome;
  const sum = {termin:`${l.person} hat Interesse an ${s.angebot}. Schmerzpunkt: ${l.schmerz.replace(/^Ehrlich gesagt\s*/,'')} Demo-Termin vereinbart.`,
    rueckruf:`Gespräch mit ${l.person} geführt, Thema grundsätzlich relevant. Rückruf vereinbart.`,
    kein:`${l.person} hat aktuell kein Interesse.`, nicht:`${l.person} nicht erreicht.`, falsch:`${l.person} ist nicht zuständig – richtige Ansprechperson erfragen.`}[o];
  const next = {termin:'Kalendereinladung für Donnerstag 10:00 schicken, Demo vorbereiten', rueckruf:'In 2 Tagen nochmal anrufen', kein:'In 6 Monaten erneut prüfen', nicht:'Morgen zur besten Anrufzeit nochmal versuchen ('+l.best+')', falsch:'Richtige Person recherchieren'}[o];
  const g = du?`Hallo ${l.vorname},`:`Sehr geehrte${l.anrede==='Herr'?'r Herr':' Frau'} ${l.nachname},`;
  const body = {termin: du?`danke dir für das nette Gespräch! Wie besprochen zeig ich dir Donnerstag um 10 Uhr in 15 Minuten, wie ${s.angebot} bei euch funktionieren würde. Die Einladung kommt gleich.`:`vielen Dank für das angenehme Gespräch. Wie besprochen zeige ich Ihnen am Donnerstag um 10 Uhr in 15 Minuten, wie ${s.angebot} bei Ihnen funktionieren würde. Die Einladung folgt in Kürze.`,
    rueckruf: du?`danke für deine Zeit vorhin. Wie besprochen meld ich mich in zwei Tagen nochmal. Bis dahin schick ich dir hier kurz das Wichtigste.`:`vielen Dank für Ihre Zeit. Wie besprochen melde ich mich in zwei Tagen wieder. Anbei finden Sie kurz das Wichtigste.`,
    kein: du?'danke dir trotzdem für deine Zeit. Falls sich bei euch was ändert, meld dich gern.':'vielen Dank trotzdem für Ihre Zeit. Falls sich bei Ihnen etwas ändert, melden Sie sich gern.',
    nicht: du?`ich hab dich vorhin telefonisch nicht erreicht. Ich hab gesehen, ${duSatz(l)} – und hätte dazu eine kurze Idee. Passt dir ein kurzer Anruf diese Woche?`:`ich habe Sie vorhin telefonisch leider nicht erreicht. Ich habe gesehen, ${l.satzSie} – und hätte dazu eine kurze Idee. Passt Ihnen ein kurzer Anruf diese Woche?`,
    falsch: du?'danke für die Info vorhin! Wer wäre bei euch die richtige Ansprechperson?':'danke für den Hinweis vorhin. Wer wäre bei Ihnen die richtige Ansprechperson?'}[o];
  return {zusammenfassung:sum, naechster_schritt:next, mail_betreff: o==='termin'?'Unsere Demo am Donnerstag':o==='nicht'?`Kurze Idee für ${l.firma}`:`Unser Gespräch – ${s.firma}`, mail_text:`${g}\n\n${body}\n\n${du?'Liebe Grüße':'Beste Grüße'}\n${s.name}\n${s.firma}`};

function parseCSV(txt){
  const rows = txt.replace(/\r/g,'').split('\n').filter(r=>r.trim());
  if (rows.length<2) return [];
  const sep = rows[0].split(';').length>rows[0].split(',').length?';':',';
  const head = rows[0].split(sep).map(h=>h.trim().toLowerCase().replace(/"/g,''));
  const col = n => head.findIndex(h=>n.some(x=>h.includes(x)));
  const ix = {firma:col(['firma','company','unternehmen']), name:col(['name','kontakt','person']), rolle:col(['rolle','titel','title','position']), tel:col(['tel','phone','nummer']), mail:col(['mail']), ort:col(['ort','stadt','city'])};
  return rows.slice(1).map((r,i)=>{ const c=r.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')); const g=k=>ix[k]>=0?(c[ix[k]]||''):'';
    const name=g('name')||'Unbekannt'; const parts=name.split(' ');
    return {id:'c'+Date.now()+i, firma:g('firma')||'Unbekannte Firma', ort:g('ort')||'–', land:'–', branche:'–', ma:0, web:'–', gegr:null, person:name, anrede:'', nachname:parts[parts.length-1], vorname:parts[0],
      rolle:g('rolle')||'–', seit:'–', tel:g('tel')||'–', mail:g('mail')||'–', trig:'Import', anlass:'Aus deiner Liste importiert', satzSie:'dass Sie zu unserer Zielgruppe passen', quelle:'CSV-Import', wann:'heute',
      news:[['Noch keine Recherche – im echten Produkt aus deinen Datenquellen','–']], linkedin:'Noch nicht recherchiert.', schmerz:'Hm, das machen wir eigentlich händisch.', score:60, best:'Di–Do, 9–11 Uhr', src:'CSV-Import', status:'offen'}; });
}

      <div class="kpi"><span class="label">Termine</span><b class="num" style="color:var(--good)">${termine}</b><small>${reached?Math.round(termine/reached*100):0} % der Gespräche</small></div>
      <div class="kpi"><span class="label">Ø Pitch-Score</span><b class="num">${avg}</b><small>aus dem Live-Coaching</small></div>
      <div class="kpi"><span class="label">Recherche gespart</span><b class="num">${Math.round(S.leads.length*6/60*10)/10} h</b><small>≈ 6 Min. pro Lead</small></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Anrufe, Gespräche, Termine</h3><div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W_} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Balkendiagramm der letzten fünf Arbeitstage">${grid}${bars}</svg></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Anrufe</span><span><i style="background:var(--sun)"></i>Erreicht</span><span><i style="background:var(--good)"></i>Termine</span></div>

      <div class="card"><h3>Ergebnisse gesamt</h3>${OUTCOMES.map(([k,n])=>`<div class="hbar"><span>${n}</span><span class="t"><i style="width:${cnt(k)/tot*100}%;${k==='termin'?'background:var(--good)':k==='kein'||k==='falsch'?'background:var(--bad)':k==='rueckruf'?'background:var(--sun)':'background:var(--muted)'}"></i></span><b class="num">${cnt(k)}</b></div>`).join('')}

      ausschluss:String(r.ausschluss||''), notiz:String(r.begruendung||''), proTag:5, prio:'mittel', aktiv:false}); save(); };
  if (!AI){ add({name:'Filialbetriebe im Handel',produkt:S.products[0].id,branchen:['Einzelhandel','Gastronomie','Bäckereien'],groesseMin:15,groesseMax:150,regionen:['AT','DE'],rollen:['Geschäftsführung','Filialleitung'],signale:['Neuer Standort','Offene Stellen'],ausschluss:'Franchise-Ketten mit zentraler IT',begruendung:'Mehrere Standorte, wechselnde Schichten, viel Abstimmung.'});

  gAiBusy=true; gAiErr=''; renderAdmin();
  try{
    const r = await AI.json(`Du hilfst bei der Zielgruppen-Planung für Kaltakquise im DACH-Raum.
Firma: ${S.kb.firma} – ${S.kb.ueberUns}

Antworte nur mit JSON: {"name":"","produkt":"produkt-id","branchen":["max 5"],"groesseMin":10,"groesseMax":100,"regionen":["AT"],"rollen":["max 3"],"signale":["max 4"],"ausschluss":"","begruendung":"1-2 Sätze"}`, {cache:false});
    add(r); toast('Neue Zielgruppe vorgeschlagen – prüfen und aktivieren');

  gAiBusy=false; renderAdmin();
}

/* Wissensbasis */
function kbScore(){
  const k=S.kb; let n=0, t=7;
  if (k.firma&&k.ueberUns&&k.ueberUns.length>40) n++;
  if (k.usps.filter(x=>x.trim()).length>=2) n++;
  if (k.referenzen.filter(x=>x.kunde).length>=1) n++;
  if (k.faq.filter(x=>x.frage).length>=2) n++;
  if (k.wettbewerber.filter(x=>x.name).length>=1) n++;
  if (k.preise&&k.preise.trim()) n++;
  if (k.docs.length) n++;
  return Math.round(n/t*100);
}

  $('#modal').hidden=false;
}

/* ---------------- events ---------------- */
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if(!a) return;
  const v = a.dataset.v;
  switch(a.dataset.act){
    case 'view': S.view=v; save(); render(); window.scrollTo(0,0); break;
    case 'filter': S.filter=v; save(); renderQueue(); break;
    case 'sel': if (C.status!=='idle'){ toast('Erst das Gespräch beenden'); break; } S.sel=v; save(); renderQueue(); renderWork(); renderDialer();
      if (window.matchMedia('(max-width:820px)').matches) $('#work').scrollIntoView({behavior:'smooth'}); break;
    case 'openlead': S.sel=v; S.view='heute'; S.tab='recherche'; save(); render(); break;
    case 'tab': S.tab=v; save(); renderWork(); break;
    case 'tone': S.tone=v; save(); renderWork(); renderDialer(); break;
    case 'genpitch': genPitch(cur()); break;
    case 'copypitch': { const p=pitchFor(cur()); copyText([p.opener,p.bruecke,...p.fragen,...p.einwaende.map(o=>o.einwand+': '+o.antwort),p.abschluss].join('\n\n')); break; }
    case 'copy': copyText(v); break;
    case 'call': startCall(); break;
    case 'hangup': hangup(); break;
    case 'reopenwrap': if (W) renderWrap(); else openWrap(false); break;
    case 'outcome': W.notes=$('#wrap-notes').value; W.outcome=v; if(W.ai) W.ai=null; renderWrap(); break;
    case 'aiwrap': aiWrap(); break;
    case 'copymail': copyText($('#mailtext').innerText); break;
    case 'savewrap': saveWrap(); break;
    case 'closewrap': $('#modal').hidden=true; break;
    case 'closemodal': $('#modal').hidden=true; break;
    case 'plans': openPlans(); break;
    case 'setplan': S.plan=v; save(); $('#modal').hidden=true; toast((v==='pro'?'Pro':'Premium')+' aktiviert (Demo)'); render(); break;
    case 'atab': S.atab=v; save(); renderAdmin(); break;
    case 'setval': { const p=a.dataset.path; const old=getPath(p); setPath(p, typeof old==='number'?Number(v):v); if(p==='pitch.ansprache') S.tone=v; autosave(p); a.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===a)); if(p.startsWith('pitch')) updateOpenerPreview(); break; }
    case 'toggle': { const p=a.dataset.path; setPath(p,!getPath(p)); a.setAttribute('aria-checked',!!getPath(p)); autosave(p); if(/^groups\.\d+\.aktiv$/.test(p) && $('#modal').hidden) renderAdmin(); break; }
    case 'chip': { const p=a.dataset.path; const arr=(getPath(p)||[]).slice(); const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); setPath(p,arr); a.setAttribute('aria-pressed',i<0); autosave(p); if(p.startsWith('leadCfg')&&$('#modal').hidden) renderAdmin(); break; }
    case 'step': { const p=a.dataset.path; const n=Math.min(+a.dataset.max,Math.max(+a.dataset.min,(+getPath(p)||0)+(+a.dataset.d))); setPath(p,n); autosave(p); renderAdmin(); break; }
    case 'listadd': { const p=a.dataset.path; const tpl=BIND_LISTS[p]; getPath(p).push(typeof tpl==='string'?'':{...tpl}); autosave(p); renderAdmin(); const ins=document.querySelectorAll(`[data-bind^="${p}.${getPath(p).length-1}"]`); if(ins[0]) ins[0].focus(); break; }
    case 'listdel': { const p=a.dataset.path; getPath(p).splice(+a.dataset.i,1); autosave(p); renderAdmin(); break; }
    case 'ph': { const ta=document.querySelector('[data-bind="pitch.opener"]'); if(!ta) break; const st=ta.selectionStart??ta.value.length; ta.value=ta.value.slice(0,st)+v+ta.value.slice(ta.selectionEnd??st); ta.focus(); ta.selectionStart=ta.selectionEnd=st+v.length; ta.dispatchEvent(new Event('input',{bubbles:true})); break; }
    case 'testpitch': S.view='heute'; S.tab='pitch'; S.tone=S.pitch.ansprache; save(); render(); window.scrollTo(0,0); break;
    case 'gnew': S.groups.push({id:'g'+Date.now(),name:'Neue Zielgruppe',produkt:S.products[0].id,branchen:[],groesseMin:10,groesseMax:100,regionen:['AT'],bundeslaender:[],rollen:[],signale:[],ausschluss:'',notiz:'',proTag:5,prio:'mittel',aktiv:true}); save(); renderAdmin(); openGroup(S.groups.length-1); break;
    case 'gedit': openGroup(+v); break;
    case 'gdel': if (a.dataset.confirm==='1'){ const g=S.groups.splice(+v,1)[0]; S.leads.forEach(l=>{ if(l.g===g.id) l.g=null; }); autosave('groups'); renderAdmin(); toast('Zielgruppe gelöscht'); }
      else { a.dataset.confirm='1'; a.textContent='Wirklich?'; setTimeout(()=>{ if(a.isConnected){ a.dataset.confirm=''; a.textContent='Löschen'; } },3000); } break;
    case 'gai': suggestGroup(); break;
    case 'pnew': S.products.push({id:'p'+Date.now(),name:'Neues Produkt',thema:'',angebot:'',nutzen:'',preis:'',laufzeit:''}); save(); renderAdmin(); openProduct(S.products.length-1); break;
    case 'pedit': openProduct(+v); break;
    case 'pdel': if (a.dataset.confirm==='1'){ const p=S.products.splice(+v,1)[0]; S.groups.forEach(g=>{ if(g.produkt===p.id) g.produkt=S.products[0].id; }); autosave('products'); renderAdmin(); toast('Produkt gelöscht – Zielgruppen auf „'+S.products[0].name+'“ umgestellt'); }
      else { a.dataset.confirm='1'; a.textContent='Wirklich?'; setTimeout(()=>{ if(a.isConnected){ a.dataset.confirm=''; a.textContent='Löschen'; } },3000); } break;
    case 'docdel': S.kb.docs.splice(+v,1); autosave('kb'); renderAdmin(); break;
    case 'closeadmin': $('#modal').hidden=true; renderAdmin(); break;
    case 'calledit': openCalling(v); break;
    case 'calloff': S.calling[v].on=false; S.calling[v].last4=''; if(S.telefonie===v) S.telefonie='browser'; CW[v]=''; save(); openCalling(v); toast(CALLING.find(t=>t.id===v).n+' getrennt'); break;
    case 'teldef': S.telefonie=v; save(); if(!$('#modal').hidden && v!=='browser') openCalling(v); renderAdmin(); toast('Anrufe laufen jetzt über '+(v==='browser'?'den Browser-Dialer':CALLING.find(t=>t.id===v).n)); break;
    case 'reset': if (a.dataset.confirm==='1'){ clearInterval(C.iv); C.status='idle'; S=freshState(); save(); render(); toast('Demo zurückgesetzt'); }
      else { a.dataset.confirm='1'; a.textContent='Wirklich zurücksetzen?'; setTimeout(()=>{ if(a.isConnected){ a.dataset.confirm=''; a.textContent='Demo zurücksetzen'; } },3000); } break;
  }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').hidden=true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden) $('#modal').hidden=true; });
document.addEventListener('submit', e=>{
  if (e.target.id==='helper-form'){ e.preventDefault(); const i=$('#helper-in'); const t=i.value.trim(); if(t) helpObjection(t); }
  if (e.target.id==='call-form'){ e.preventDefault(); const id=e.target.dataset.id; const t=CALLING.find(x=>x.id===id);
    const vals=t.f.map((_,i)=>$('#cf-'+i).value.trim()); const c=S.calling[id];
    if (vals.some(x=>x.length<4) && !c.on){ CW[id]='Bitte alle Felder ausfüllen.'; $('#cf-msg').textContent=CW[id]; $('#cf-msg').style.color='var(--bad)'; return; }
    const last=vals[vals.length-1]; if(last) c.last4=last.slice(-4);
    c.on=true; if(S.telefonie==='browser') S.telefonie=id; CW[id]='Verbunden (Demo) – '+DEMO_NUMS.length+' Nummern gefunden.'; save(); openCalling(id); }
});
function onBind(e){
  const el=e.target; const p=el.dataset && el.dataset.bind; if(!p) return;
  const ty=el.dataset.type; let v=el.value;
  if (ty==='num') v = v===''?0:Number(v);
  else if (ty==='csv') v = v.split(',').map(x=>x.trim()).filter(Boolean);
  setPath(p,v); autosave(p);
  if (el.dataset.out){ const o=$('#'+el.dataset.out); if(o) o.textContent=el.value; }
  if (p.startsWith('pitch')||p.startsWith('kb.meinName')||p.startsWith('kb.firma')) updateOpenerPreview();
  if (p==='kb.meinName') renderTop();
}
document.addEventListener('input', onBind);
document.addEventListener('change', e=>{
  if (e.target.tagName==='SELECT' && e.target.dataset.bind) onBind(e);
  if (e.target.id==='gfilter'){ S.gfilter=e.target.value; save(); renderQueue(); return; }
  if (e.target.id==='kb-up' && e.target.files.length){
    const files=[...e.target.files]; let left=files.length;
    files.forEach(f=>{ const isText=/\.(txt|md|csv)$/i.test(f.name)||/^text\//.test(f.type);
      const done=text=>{ S.kb.docs.push({name:f.name,size:f.size,text:text?String(text).slice(0,20000):''}); if(--left===0){ autosave('kb'); renderAdmin(); toast(files.length+' Dokument'+(files.length>1?'e':'')+' hinzugefügt'); } };
      if (isText && f.size<2e6){ const r=new FileReader(); r.onload=()=>done(r.result); r.onerror=()=>done(''); r.readAsText(f); } else done(''); });
    return;
  }
  if (e.target.id!=='csv-in' || !e.target.files[0]) return;
  const f=e.target.files[0]; const r=new FileReader();
  r.onload=()=>{ const rows=parseCSV(String(r.result)); if(!rows.length){ toast('Keine Zeilen gefunden – erste Zeile muss Spaltennamen enthalten'); return; }
    S.leads=S.leads.concat(rows); save(); renderLeads(); renderNav(); toast(rows.length+' Leads importiert'); };
  r.readAsText(f);
});

$('#brand-mascot').innerHTML = mascot(32);
render();
})();
</script>
