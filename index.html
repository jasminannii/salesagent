<html lang="de">
<head>

<meta name="description" content="brayyn – dein KI-Sales-Agent: Anrufliste, Dialer, Lead-Recherche, Pitch und Live-Coaching. Gebaut für Vertriebsteams im DACH-Raum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800;900&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#0A0E1A;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0A0E1A}a:hover{color:#1E52D6}
button{font-family:inherit}
@keyframes bblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.12)}}
@keyframes blook{0%,40%,100%{transform:translateX(0)}50%,70%{transform:translateX(2px)}}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bfloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes bglow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.9}}
@keyframes bpulse{0%{box-shadow:0 0 0 0 rgba(18,178,106,0.5)}100%{box-shadow:0 0 0 20px rgba(18,178,106,0)}}
@keyframes bwave{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}
@keyframes bin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.b-eyes{animation:blook 6s ease-in-out infinite}
.b-eye{transform-box:fill-box;transform-origin:center;animation:bblink 4.5s infinite}
.b-float{animation:bfloat 5s ease-in-out infinite}
.b-float2{animation:bfloat2 6s ease-in-out infinite}
.b-glow{animation:bglow 3.5s ease-in-out infinite}
.b-pulse{animation:bpulse 1.4s infinite}
.b-wave{animation:bwave .9s ease-in-out infinite;transform-origin:center}
.b-in{animation:bin .35s ease-out both}
</style>
</head>
<body>

<div id="app"></div>

<div style="width: 100%; background: #FFFFFF; color: #0A0E1A; font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; overflow-x: hidden">

<!-- ================= NAV ================= -->
<header style="position: relative; z-index: 5; background: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(10,14,26,0.06)">
<nav style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px" aria-label="Hauptnavigation">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0A0E1A">
<svg width="34" height="34" viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="bfg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DB0FF"></stop><stop offset="1" stop-color="#2F6BF6"></stop></linearGradient></defs><circle cx="40" cy="40" r="38" fill="url(#bfg)"></circle><rect x="13" y="20" width="54" height="40" rx="20" fill="#0A0E1C"></rect><g class="b-eyes"><rect class="b-eye" x="28" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect><rect class="b-eye" x="44" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect></g></svg>
<span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.03em">brayyn</span>
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 26px; font-size: 15px; font-weight: 600">
<a href="#produkt" style="text-decoration: none; color: #39415A">Produkt</a>
<a href="#arbeiten" style="text-decoration: none; color: #39415A">Integrationen</a>
<a href="#teams" style="text-decoration: none; color: #39415A">Für Teams</a>
<a href="#preise" style="text-decoration: none; color: #39415A">Preise</a>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<a href="#start" style="text-decoration: none; font-size: 15px; font-weight: 600; color: #0A0E1A; padding: 10px 16px; border-radius: 12px; border: 1px solid #E1E5EE; background: #FFFFFF">Einloggen</a>
<a href="#start" style="text-decoration: none; font-size: 15px; font-weight: 700; color: #FFFFFF; padding: 11px 18px; border-radius: 12px; background: {{accent}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px -10px rgba(47,107,246,0.8)">Gratis testen</a>
</div>
</nav>
</header>

<!-- ================= HERO ================= -->
<section id="top" style="position: relative; background: linear-gradient(180deg, #FFFFFF 0%, #F4F8FF 30%, #E2ECFF 52%, #E9E4FF 70%, #FFFFFF 94%)">
<div style="max-width: 1000px; margin: 0 auto; padding: 56px 24px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px">
<a href="#produkt" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; font-weight: 700; color: #0A0E1A; background: #FFFFFF; border: 1px solid #E1E5EE; padding: 7px 16px 7px 8px; border-radius: 999px; box-shadow: 0 6px 20px -10px rgba(31,82,214,0.4)">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #0A0E1C; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></span>
Probier brayyn direkt hier aus
</a>
<h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 900; font-size: 72px; line-height: 1.02; letter-spacing: -0.05em">Dein KI-Sales-Agent.<br>Du telefonierst. <span style="background: linear-gradient(90deg, #2F6BF6, #8E5CF6); -webkit-background-clip: text; background-clip: text; color: transparent">brayyn macht den Rest.</span></h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #39415A; max-width: 640px">Anrufliste, Dialer, Lead-Recherche, Pitch und Live-Coaching im Gespräch – in einem Agenten. Gebaut für Vertriebsteams im DACH-Raum.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 4px">
<a href="#start" style="display: flex; align-items: center; gap: 10px; text-decoration: none; background: {{accent}}; color: #FFFFFF; padding: 15px 26px 15px 16px; border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 14px 30px -12px rgba(47,107,246,0.85)">
<svg width="26" height="26" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="#FFFFFF"></circle><rect x="13" y="20" width="54" height="40" rx="20" fill="#0A0E1C"></rect><rect x="28" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect><rect x="44" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect></svg>
30 Leads gratis testen
</a>
<a href="#produkt" style="text-decoration: none; background: #FFFFFF; border: 1px solid #E1E5EE; color: #0A0E1A; padding: 15px 24px; border-radius: 14px; font-weight: 700; font-size: 17px">Live-Demo ansehen</a>
</div>
<span style="font-size: 14px; color: #697088">30 Leads + 3 Anrufe gratis · Keine Kreditkarte · DSGVO-konform, EU-gehostet</span>
</div>

<!-- Product shot -->
<div id="produkt" style="position: relative; max-width: 1180px; margin: 0 auto; padding: 18px 24px 40px">

<!-- floating badges -->
<div class="b-float" style="position: absolute; left: 0; top: 140px; z-index: 3; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 16px; padding: 10px 14px; box-shadow: 0 20px 40px -18px rgba(10,14,26,0.35); font-size: 14px; font-weight: 700">
<span style="width: 28px; height: 28px; border-radius: 9px; background: #E7F7EF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12B26A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
Termin fixiert · Do 10:00
</div>
<div class="b-float2" style="position: absolute; right: 0; top: 70px; z-index: 3; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 16px; padding: 10px 14px; box-shadow: 0 20px 40px -18px rgba(10,14,26,0.35); font-size: 14px; font-weight: 700">
<span style="width: 28px; height: 28px; border-radius: 9px; background: #FFF4DE; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #8A5A0B">!</span>
Einwand erkannt: „Keine Zeit“
</div>
<div class="b-float2" style="position: absolute; left: 30px; bottom: 30px; z-index: 3; display: flex; align-items: center; gap: 10px; background: #0A0E1C; color: #FFFFFF; border-radius: 16px; padding: 10px 14px; box-shadow: 0 20px 40px -18px rgba(10,14,26,0.5); font-size: 14px; font-weight: 700">
<span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 18px; color: #7DB0FF">+3</span> Termine heute
</div>

<!-- App window -->
<div style="position: relative; z-index: 2; background: #FFFFFF; border: 1px solid rgba(10,14,26,0.08); border-radius: 24px; box-shadow: 0 50px 100px -40px rgba(31,62,160,0.45), 0 10px 30px -15px rgba(10,14,26,0.15); overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #ECEEF4">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="24" height="24" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="url(#bfg)"></circle><rect x="13" y="20" width="54" height="40" rx="20" fill="#0A0E1C"></rect><rect x="28" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect><rect x="44" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect></svg>
<span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 17px">brayyn</span>
</div>
<div style="display: flex; gap: 4px; background: #F6F7FB; border-radius: 10px; padding: 3px; font-size: 13px; font-weight: 700">
<span style="padding: 6px 12px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(10,14,26,0.08)">Dialer</span>
<span style="padding: 6px 12px; color: #697088">Leads</span>
<span style="padding: 6px 12px; color: #697088">Auswertung</span>
</div>
<span style="margin-left: auto; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #E7F7EF; color: #0B7A48">{{doneCount}} / 30 erledigt</span>
</div>

<div style="display: flex; flex-wrap: wrap; min-height: 560px">

<!-- Queue -->
<div style="flex: 0 1 270px; min-width: 240px; border-right: 1px solid #ECEEF4; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; background: #FBFCFE">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px">
<span style="font-size: 13px; font-weight: 800">Heute anrufen</span>
<span style="font-size: 12px; color: #697088">nach Chance sortiert</span>
</div>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="5">
<button type="button" onClick="{{q.open}}" style="text-align: left; width: 100%; display: flex; gap: 10px; align-items: center; background: {{q.bg}}; border: 1px solid {{q.border}}; border-radius: 14px; padding: 10px; cursor: pointer; color: #0A0E1A; box-shadow: {{q.shadow}}">
<span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; background: {{q.avBg}}; color: {{q.avFg}}; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{q.ini}}</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.company}}</span>
<span style="font-size: 12px; color: #697088; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.sub}}</span>
</span>
<span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: {{q.tagBg}}; color: {{q.tagFg}}">{{q.tag}}</span>
</button>
</sc-for>
</div>

<!-- Lead + pitch -->
<div style="flex: 1 1 380px; min-width: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 14px; align-items: center">
<span style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #EEF3FF, #E6E0FF); color: #1E52D6; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center">{{L.ini}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0">
<span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">{{L.company}}</span>
<span style="font-size: 14px; color: #697088">{{L.person}} · {{L.city}} · {{L.size}}</span>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #E7F7EF; color: #0B7A48">✓ Nummer geprüft</span>
<span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #FFF4DE; color: #8A5A0B">{{L.legal}}</span>
<span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #F6F7FB; color: #39415A">{{L.last}}</span>
</div>
<div style="background: linear-gradient(135deg, #F4F8FF, #F3F0FF); border: 1px solid #E3EAFB; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 800; color: #1E52D6">⚡ WARUM JETZT ANRUFEN</span>
<span style="font-size: 16px; line-height: 1.45; font-weight: 600">{{L.why}}</span>
</div>
<div style="border: 1px solid #ECEEF4; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 800; color: #697088">DEIN PITCH</span>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; background: #2F6BF6; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 14px; line-height: 1.5">{{L.opener}}</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; background: #6E8BFA; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 14px; line-height: 1.5">{{L.value}}</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; background: #8E5CF6; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 14px; line-height: 1.5">{{L.close}}</span></div>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<div style="flex: 1 1 220px; border: 1px solid #ECEEF4; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.5"><strong style="display: block; font-size: 12px; color: #697088; margin-bottom: 4px">WENN ER SAGT …</strong>{{L.objection}}</div>
<div style="flex: 1 1 180px; border: 1px solid #ECEEF4; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.5"><strong style="display: block; font-size: 12px; color: #697088; margin-bottom: 4px">AUS EUREM WISSEN</strong>{{L.ref}}</div>
</div>
</div>

<!-- Dialer & coach -->
<div style="flex: 0 1 360px; min-width: 300px; padding: 14px; background: #F6F7FB">
<div style="height: 100%; box-sizing: border-box; background: #0A0E1C; color: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px -20px rgba(10,14,26,0.6)">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{statusDot}}"></span>{{statusLabel}}</span>
<span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; font-family: 'Schibsted Grotesk', system-ui, sans-serif">{{callTime}}</span>
</div>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 10px 0">
<div style="position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center">
<span class="b-glow" style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(111,160,255,0.55), rgba(111,160,255,0) 70%)"></span>
<svg class="b-float" width="88" height="88" viewBox="0 0 80 80" aria-hidden="true" style="position: relative"><circle cx="40" cy="40" r="38" fill="url(#bfg)"></circle><rect x="13" y="20" width="54" height="40" rx="20" fill="#0A0E1C"></rect><g class="b-eyes"><rect class="b-eye" x="28" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect><rect class="b-eye" x="44" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect></g></svg>
</div>
<span style="font-size: 15px; line-height: 1.5; color: #C4CADB">Bereit, {{L.short}} anzurufen?<br>Ich höre mit und coache dich live.</span>
<span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.02em">{{L.phone}}</span>
<button type="button" onClick="{{startCall}}" class="b-pulse" style="width: 68px; height: 68px; border-radius: 50%; border: 0; background: #12B26A; cursor: pointer; display: flex; align-items: center; justify-content: center" aria-label="Anrufen">
<svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"></path></svg>
</button>
</div>
</sc-if>

<sc-if value="{{isCalling}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto">
<div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px" aria-hidden="true">
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #7DB0FF"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #7DB0FF; animation-delay: .12s"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #9D8CFF; animation-delay: .24s"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #9D8CFF; animation-delay: .36s"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #7DB0FF; animation-delay: .48s"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #7DB0FF; animation-delay: .6s"></span>
<span class="b-wave" style="width: 4px; height: 26px; border-radius: 4px; background: #9D8CFF; animation-delay: .72s"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA2B8"><span>Du redest {{talkMe}} %</span><span>{{talkHint}}</span></div>
<div style="height: 6px; border-radius: 999px; background: #1E2744; overflow: hidden"><div style="height: 6px; border-radius: 999px; background: {{talkColor}}; width: {{talkMe}}%; transition: width .4s"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-height: 250px">
<sc-for list="{{feed}}" as="m" hint-placeholder-count="3">
<sc-if value="{{m.isLine}}" hint-placeholder-val="{{ true }}">
<div class="b-in" style="font-size: 13px; line-height: 1.45; color: #C4CADB"><strong style="color: {{m.whoColor}}">{{m.who}}:</strong> {{m.text}}</div>
</sc-if>
<sc-if value="{{m.isTip}}" hint-placeholder-val="{{ false }}">
<div class="b-in" style="display: flex; gap: 10px; align-items: flex-start; background: {{m.bg}}; color: #0A0E1A; border-radius: 14px; padding: 10px 12px">
<svg width="26" height="26" viewBox="0 0 80 80" aria-hidden="true" style="flex: 0 0 26px"><circle cx="40" cy="40" r="38" fill="url(#bfg)"></circle><rect x="13" y="20" width="54" height="40" rx="20" fill="#0A0E1C"></rect><rect x="28" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect><rect x="44" y="31" width="8" height="16" rx="4" fill="#FFFFFF"></rect></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 900; letter-spacing: 0.06em; color: {{m.labelColor}}">{{m.label}}</span><span style="font-size: 13px; line-height: 1.4; font-weight: 600">{{m.text}}</span></span>
</div>
</sc-if>
</sc-for>
</div>
<button type="button" onClick="{{endCall}}" style="margin-top: auto; align-self: center; border: 0; border-radius: 999px; background: #D64550; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 12px 26px; cursor: pointer">Auflegen</button>
</div>
</sc-if>
